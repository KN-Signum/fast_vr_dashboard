name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      confirm_brainaccess_redistribution:
        description: Confirm that BrainAccess DLL redistribution has been reviewed
        required: true
        type: boolean
        default: false
      sign_release:
        description: Sign the executable and installer using repository secrets
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      FLUTTER_VERSION: "3.41.2"
      INNO_SETUP_VERSION: "6.7.1"
      UV_VERSION: "0.7.19"

    steps:
      - name: Require BrainAccess redistribution confirmation
        shell: pwsh
        run: |
          if ("${{ inputs.confirm_brainaccess_redistribution }}" -ne "true") {
            throw "BrainAccess DLL redistribution must be confirmed to build a release."
          }

      - name: Check out source
        uses: actions/checkout@v6.0.2

      - name: Configure Git for Windows builds
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup `
            --version="$env:INNO_SETUP_VERSION" `
            --yes `
            --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler -PathType Leaf)) {
            throw "ISCC.exe was not installed at the expected path: $compiler"
          }

      - name: Import signing certificate
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if ("${{ inputs.sign_release }}" -ne "true") {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "WINDOWS_CODESIGN_PFX_BASE64 is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "WINDOWS_CODESIGN_PFX_PASSWORD is not configured."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "panel-vr-codesign.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:PFX_BASE64)
          )
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          $certificate = $imported |
            Where-Object {
              $_.HasPrivateKey -and (
                $_.EnhancedKeyUsageList.ObjectId.Value -contains "1.3.6.1.5.5.7.3.3"
              )
            } |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw "The PFX does not contain a code-signing certificate with a private key."
          }

          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "thumbprint=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and verify release
        shell: pwsh
        run: |
          $releaseArguments = @{
            ConfirmBrainAccessRedistribution = $true
          }
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            $releaseArguments.CertificateThumbprint =
              "${{ steps.signing.outputs.thumbprint }}"
          }

          & .\scripts\build_release.ps1 @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed with exit code $LASTEXITCODE."
          }

      - name: Upload Windows release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PanelVR-${{ steps.version.outputs.value }}-windows-x64
          path: release/${{ steps.version.outputs.value }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PanelVR-windows-build-diagnostics
          path: |
            build/PanelVR/warn-PanelVR.txt
            build/PanelVR/xref-PanelVR.html
            dist/PanelVR/package-manifest.json
            backend/static/web/build-info.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $certificatePath = "Cert:\CurrentUser\My\${{ steps.signing.outputs.thumbprint }}"
          if (Test-Path $certificatePath) {
            Remove-Item $certificatePath -Force
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "panel-vr-codesign.pfx"
          if (Test-Path $pfxPath) {
            Remove-Item $pfxPath -Force
          }

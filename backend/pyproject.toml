[project]
name = "backend"
version = "0.1.0"
description = "FastAPI and WebSocket runtime for the Panel VR dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "mne>=1.10.0",
    "multimethod>=2.0",
    "numpy>=2.3",
    "uvicorn>=0.42.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]
package = [
    "pyinstaller>=6.15",
]
